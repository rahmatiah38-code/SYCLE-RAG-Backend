name: Evidence Pipeline (Google Drive -> Supabase)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"     # 01:00 UTC = 08:00 WIB

jobs:
  load-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Rahasia -> GitHub Secrets
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Bukan rahasia
          XLSX_MIME: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          GSHEET_MIME: application/vnd.google-apps.spreadsheet
          SCOPES: https://www.googleapis.com/auth/drive.readonly
          EVIDENCE_TABLE: evidence_registry
          EVIDENCE_CHUNK_TABLE: evidence_chunks
          ON_CONFLICT: source_code
          PROJECT_NAME: Sycle_LCH_PI
          # Script ini membuat embedding
          EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        run: python sycle_rag_action.py